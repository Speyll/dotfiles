################### MangoHud Config (portable / cross-hardware) ###################

legacy_layout=false
no_display=0

# --- Layout / Appearance ---
horizontal
horizontal_stretch=0
background_alpha=0.3
round_corners=10
background_color=000000
text_color=FFFFFF
font_size=24
# font_size_text=24      # deprecated in newer MangoHud; font_size covers both
position=top-left

hud_compact
hud_no_margin

# --- Table ---
table_columns=2

# --- GPU ---
# NOTE: Do NOT set pci_dev or gpu_list here.
#   pci_dev is machine-specific (that was the reason your laptop lost GPU stats).
#   With neither set, MangoHud auto-detects whichever GPU is actually rendering.
gpu_text=GPU
gpu_stats
gpu_load_change
gpu_load_value=50,90
gpu_load_color=FFFFFF,FFAA7F,CC0000
gpu_temp
gpu_power
gpu_mem_temp
gpu_color=2E9762

# --- CPU ---
cpu_text=CPU
cpu_stats
cpu_load_change
cpu_load_value=50,90
cpu_load_color=FFFFFF,FFAA7F,CC0000
cpu_temp
#cpu_power               # uncomment only if your laptop exposes CPU package power
cpu_color=2E97CB

# --- Memory ---
vram
vram_color=AD64C1
ram
ram_color=C26693

# --- FPS / Frame timing ---
fps
show_fps_limit
frame_timing
frametime_color=00FF00
fps_limit_method=early

fps_limit=120,90,60,48,30,0
fps_color_change
fps_color=B22222,FDFD09,39F900
fps_value=60,120
vsync=0
gl_vsync=-1

# --- Misc ---
time

# --- Logging ---
output_folder=~/.cache
log_duration=30
autostart_log=0
log_interval=100

# --- Blacklist (add any laptop-specific background apps here too) ---
blacklist=protonplus,lsfg-vk-ui,bazzar,gnome-calculator,pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex

toggle_logging=Shift_L+F2
