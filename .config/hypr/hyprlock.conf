general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = /tmp/wall.jpg

    # 2 passes @ size 7 is faster than 3 @ size 8 with virtually zero visual difference
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.70
    vignette = 0.25

    color = rgb(23, 23, 23)
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgb(235, 219, 178)
    font_size = 90
    font_family = Sans Bold
    position = 0, 130
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:43200000] echo "$(date +"%A, %B %d")"
    color = rgba(235, 219, 178, 0.65)
    font_size = 18
    font_family = Sans
    position = 0, 50
    halign = center
    valign = center
}

# USER GREETING
label {
    monitor =
    text = Hi, $USER
    color = rgba(235, 219, 178, 0.45)
    font_size = 14
    font_family = Sans
    position = 0, 0
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    rounding = -1

    # Gruvbox-aligned ring feedback
    outer_color = rgba(0, 0, 0, 0)
    check_color = rgb(215, 153, 33)
    fail_color = rgb(204, 36, 29)
    inner_color = rgba(40, 40, 40, 0.45)
    font_color = rgb(235, 219, 178)

    fade_on_empty = false
    placeholder_text = <span foreground="##ebdbb288"><i>Type Password...</i></span>
    hide_input = false
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200

    position = 0, -70
    halign = center
    valign = center
}
