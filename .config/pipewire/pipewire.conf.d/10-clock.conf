# Local PipeWire clock/quantum overrides.
#
# Everything else is intentionally left to the installed PipeWire defaults
# (the package's /usr/share/pipewire/pipewire.conf). The old, hand-copied
# pipewire.conf was a verbatim copy of the 1.2.5 defaults except for the
# quantum values, so only the quantum settings are kept here.
#
# These values DIFFER from the previous configuration, which used
# default.clock.quantum = 512 and default.clock.min-quantum = 128. The new
# values were chosen deliberately for a conservative general-purpose setup
# with more scheduling headroom, especially under CPU load. This is not a
# revert, and the old numbers should not be restored.
#
# Trade-off (quantum is the buffer size in samples; at the default 48 kHz
# graph rate, 1024 samples is ~21 ms):
#   - Larger quantum  -> buffers more per wake-up and can increase latency. It
#     may reduce processing pressure on the graph, but a larger quantum alone
#     cannot guarantee the absence of under-runs.
#   - Smaller quantum -> lower latency, but less scheduling headroom, so
#     under-runs become more likely when the machine is loaded.
#   - quantum is the default used when a client does not request one;
#     min-quantum is the smallest a client may request.
#
# Only these two are pinned:
#   - quantum = 1024: matches the stock upstream default, pinned here so the
#     intent is explicit.
#   - min-quantum = 256: a deliberate floor (stock default is 32). Low-latency
#     clients can still ask for less than the default, but cannot request
#     pathologically small quanta that invite under-runs.
# default.clock.max-quantum and default.clock.rate are intentionally left
# unset so the installed defaults apply.
#
# The VM clock override (default.clock.min-quantum = 1024 inside a VM) is part
# of the stock upstream pipewire.conf, so it is not duplicated here.
context.properties = {
    default.clock.quantum     = 1024
    default.clock.min-quantum = 256
}
