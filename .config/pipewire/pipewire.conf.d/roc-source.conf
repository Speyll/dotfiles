# ROC phone-microphone input (network audio from a ROC sender).
#
# This is an active drop-in. When pipewire-roc is installed, the ROC receiver
# is exposed directly as an Audio/Source node named `phone_mic_roc`
# ("Phone Mic (ROC)"). No loopback is needed: libpipewire-module-roc-source
# accepts `media.class` as a general option and passes it to its stream, and
# this is exactly how PipeWire's own PulseAudio-compatibility `module-roc-source`
# exposes ROC as a source (it sets source.props.media.class = "Audio/Source"
# and loads this same native module, keeping its built-in AUTOCONNECT flag).
#
# Availability and safety:
#   - `flags = [ ifexists nofail ]`: if pipewire-roc is not installed, or the
#     ROC receiver fails to initialise, this fragment is skipped and ordinary
#     audio keeps working. On such machines the module is never loaded, so
#     NEITHER the ROC receiver NOR any dependent node is created.
#   - pipewire-roc is optional for normal audio and required only for ROC
#     reception.
#   - ROC only starts receiving once something captures from the source.

context.modules = [
    {
        name = libpipewire-module-roc-source
        args = {
            local.ip          = "0.0.0.0"
            local.source.port = 10001
            local.repair.port = 10002
            source.name       = "phone_mic_roc"
            source.props = {
                node.description = "Phone Mic (ROC)"
                media.class      = "Audio/Source"
                node.autoconnect = false
            }
        }
        # ifexists: skip this module when pipewire-roc is not installed
        # nofail:   ignore other ROC init failures instead of aborting PipeWire
        flags = [ ifexists nofail ]
    }
]
