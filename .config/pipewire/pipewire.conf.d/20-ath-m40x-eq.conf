# Audio-Technica ATH-M40x parametric EQ (active).
#
# Profile: AutoEq, oratory1990 measurement, target = Harman over-ear 2018.
#   results/oratory1990/over-ear/Audio-Technica ATH-M40x/
#   Audio-Technica ATH-M40x ParametricEQ.txt
# The profile lives in the adjacent `eq/` directory and includes a -5.6 dB
# preamp for headroom, so no extra gain is needed and it will not clip.
#
# What this does:
#   - Loads libpipewire-module-parametric-equalizer, which exposes a virtual
#     output named "ATH-M40x (AutoEq Harman)". Send audio to that sink and it
#     is equalised, then played on whatever real sink it is routed to.
#   - It does NOT change the default output and does NOT touch inputs or other
#     outputs. Select it explicitly in a mixer (pavucontrol/wpctl), and switch
#     back to your physical output for speakers.
#
# Requirements and safety:
#   - Needs libpipewire-module-parametric-equalizer (documented since PipeWire
#     1.0.6) and the filter-chain `param_eq` builtin (documented since 1.4).
#     Arch's current pipewire (1.6.x) satisfies this.
#   - `flags = [ ifexists nofail ]`: if the module or the profile file is
#     missing, this fragment is skipped and ordinary audio keeps working.
#   - equalizer.filepath MUST be an absolute path: PipeWire does not expand `~`
#     or environment variables, and relative paths resolve against the daemon's
#     working directory. Adjust the path if your HOME differs.
#
# Linux cannot reliably auto-detect which analogue headphones are plugged into
# a jack, so this preset is selected manually; it does not switch on headphone
# plug/unplug.

context.modules = [
    {   name = libpipewire-module-parametric-equalizer
        flags = [ ifexists nofail ]
        args = {
            equalizer.filepath = "/home/lyes/.config/pipewire/eq/ATH-M40x-oratory1990-harman.txt"
            equalizer.description = "ATH-M40x (AutoEq Harman)"
            audio.channels = 2
            audio.position = [ FL FR ]
            # capture.props is the exposed virtual sink: the "output device"
            # that apps and pavucontrol see. Give it a low priority.session so
            # it is never chosen as the automatic default. (WirePlumber also
            # treats filter-chain nodes as "smart filters" and skips them when
            # picking a default; a manual choice always overrides this.)
            capture.props = {
                node.name = "effect_input.ath_m40x"
                media.class = Audio/Sink
                priority.session = 0
            }
            # playback.props is the internal stream that carries the equalised
            # audio onward to whatever real sink it gets routed to.
            playback.props = {
                node.name = "effect_output.ath_m40x"
                node.passive = true
            }
        }
    }
]
