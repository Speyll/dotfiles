# --- Playlist Management ---
F11         cycle-values loop-playlist yes no ; show-text "Loop: ${loop-playlist}"

# --- Video Control ---
Alt+r       cycle-values video-rotate 90 180 270 0 ; show-text "Rotation: ${video-rotate}°"
F9          cycle-values video-rotate 90 180 270 0 ; show-text "Rotation: ${video-rotate}°"
Ctrl+s      write-watch-later-config ; show-text "Watch Later Config Saved"

# Pan around using the Numpad layout (8=Up, 2=Down, 4=Left, 6=Right)
KP8 add video-pan-y 0.05
KP2 add video-pan-y -0.05
KP4 add video-pan-x 0.05
KP6 add video-pan-x -0.05

# Quick Edge Snap & Reset (Numpad 7 for left edge, 3 for right edge, 5 to reset)
KP7 add video-zoom 0.35
KP3 add video-zoom -0.35
KP5 set video-zoom 0; set video-pan-x 0; set video-pan-y 0
