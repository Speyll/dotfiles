# General Configuration
include=~/.config/fuzzel/colors.ini

font=monospace:size=14
dpi-aware=auto
prompt=""
icon-theme=breeze-dark
icons-enabled=yes
fields=filename,name,generic
password-character=*
filter-desktop=no
match-mode=fzf
show-actions=no

# Layout Settings (Optimized for smooth scrolling)
anchor=center
lines=10
width=28
tabs=4
horizontal-pad=18
vertical-pad=12
inner-pad=4
image-size-ratio=0.5
line-height=28
letter-spacing=0
layer=top
exit-on-keyboard-focus-loss=yes

# Border Settings (Disabled completely)
[border]
width=0
radius=8

# dmenu Settings
[dmenu]
exit-immediately-if-empty=no
